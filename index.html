<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Local-only online notepad. All notes stored in your browser. Nothing uploaded.">
  <meta name="theme-color" content="#1a1a2e">
  <title>Notepad — Local-Only Text Editor</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="stylesheet" href="style.css?v=26">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
</head>
<body>
  <!-- Mobile sidebar toggle -->
  <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h2>Notes</h2>
      <p class="privacy-note" title="All notes stored locally in your browser. Nothing uploaded.">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        Local only — no server storage
      </p>
    </div>
    <button class="btn-create" id="btnCreate">+ Create New</button>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search notes...">
    </div>
    <div class="note-list" id="noteList"></div>
    <div class="sidebar-footer">
      <button id="btnImportFile" title="Dosya içe aktar (TXT/Word/Excel/PDF/Resim + OCR)">Dosya İçe Aktar</button>
    </div>
    <div class="sidebar-footer" style="border-top:none;padding-top:0">
      <button id="btnExportAll" title="Export all notes as JSON backup">Export Backup</button>
      <button id="btnImportAll" title="Import JSON backup">Import Backup</button>
      <input type="file" id="backupInput" accept=".json" style="display:none">
    </div>
    <div class="sidebar-footer" style="border-top:none;padding-top:0">
      <button id="btnExportSql" title="Export all notes as SQL dump">Export SQL</button>
      <button id="btnImportSql" title="Import SQL dump">Import SQL</button>
      <input type="file" id="sqlInput" accept=".sql" style="display:none">
    </div>
    <div class="sidebar-footer" style="border-top:none;padding-top:0">
      <select id="ocrEngine" title="OCR Motoru" style="flex:1;background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.75);border:1px solid rgba(255,255,255,0.1);border-radius:5px;padding:6px;font-size:11px">
        <option value="paddle">OCR: PaddleOCR (hızlı)</option>
        <option value="tesseract">OCR: Tesseract (TR iyi)</option>
      </select>
    </div>
  </aside>

  <!-- Main Editor -->
  <main class="editor-area" id="editorArea">
    <!-- Toolbar -->
    <div class="toolbar" id="toolbar">
      <div class="toolbar-group">
        <button title="Yeni Not (Ctrl+Alt+N)" data-action="new">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
        </button>
        <button title="Open (Ctrl+O)" data-action="open">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
        </button>
        <div class="save-dropdown-wrap">
          <button title="Save (Ctrl+S)" data-action="toggleSaveMenu">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
            <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor" style="margin-left:2px"><path d="M7 10l5 5 5-5z"/></svg>
          </button>
          <div class="save-dropdown" id="saveDropdown">
            <button data-action="saveTxt">Save as .txt</button>
            <button data-action="savePdf">Save as PDF</button>
            <button data-action="saveWord">Save as Word (.docx)</button>
          </div>
        </div>
        <div class="save-dropdown-wrap">
          <button title="Paylaş" data-action="toggleShareMenu">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
            <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor" style="margin-left:2px"><path d="M7 10l5 5 5-5z"/></svg>
          </button>
          <div class="save-dropdown" id="shareDropdown">
            <button data-action="shareDevice">Cihazdan Paylaş (dosya)</button>
            <button data-action="shareWhatsApp">WhatsApp (metin)</button>
            <button data-action="shareEmail">E-posta (metin)</button>
            <button data-action="shareEmailPdf">E-posta + PDF indir</button>
            <button data-action="shareWhatsAppPdf">WhatsApp + PDF indir</button>
          </div>
        </div>
        <button title="Print (Ctrl+P)" data-action="print">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
        </button>
      </div>
      <div class="toolbar-divider"></div>
      <div class="toolbar-group">
        <button title="Undo (Ctrl+Z)" data-action="undo">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
        </button>
        <button title="Redo (Ctrl+Y)" data-action="redo">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.13-9.36L23 10"/></svg>
        </button>
      </div>
      <div class="toolbar-divider"></div>
      <div class="toolbar-group">
        <button title="Bold (Ctrl+B)" data-action="bold"><b>B</b></button>
        <button title="Italic (Ctrl+I)" data-action="italic"><i>I</i></button>
        <button title="Underline (Ctrl+U)" data-action="underline"><u>U</u></button>
        <button title="Strikethrough" data-action="strikeThrough"><s>S</s></button>
      </div>
      <div class="toolbar-divider"></div>
      <div class="toolbar-group">
        <select id="fontFamily" title="Font Family">
          <option value="sans-serif">Sans Serif</option>
          <option value="serif">Serif</option>
          <option value="monospace">Monospace</option>
          <option value="Arial">Arial</option>
          <option value="Georgia">Georgia</option>
          <option value="Times New Roman">Times New Roman</option>
          <option value="Courier New">Courier New</option>
          <option value="Verdana">Verdana</option>
        </select>
        <select id="fontSize" title="Font Size">
          <option value="1">8</option>
          <option value="2">10</option>
          <option value="3" selected>12</option>
          <option value="4">14</option>
          <option value="5">18</option>
          <option value="6">24</option>
          <option value="7">36</option>
        </select>
      </div>
      <div class="toolbar-divider"></div>
      <div class="toolbar-group">
        <button title="Align Left" data-action="justifyLeft">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="17" y1="10" x2="3" y2="10"/><line x1="21" y1="6" x2="3" y2="6"/><line x1="21" y1="14" x2="3" y2="14"/><line x1="17" y1="18" x2="3" y2="18"/></svg>
        </button>
        <button title="Align Center" data-action="justifyCenter">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="10" x2="6" y2="10"/><line x1="21" y1="6" x2="3" y2="6"/><line x1="21" y1="14" x2="3" y2="14"/><line x1="18" y1="18" x2="6" y2="18"/></svg>
        </button>
        <button title="Align Right" data-action="justifyRight">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="21" y1="10" x2="7" y2="10"/><line x1="21" y1="6" x2="3" y2="6"/><line x1="21" y1="14" x2="3" y2="14"/><line x1="21" y1="18" x2="7" y2="18"/></svg>
        </button>
      </div>
      <div class="toolbar-divider"></div>
      <div class="toolbar-group">
        <button title="Ordered List" data-action="insertOrderedList">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="10" y1="6" x2="21" y2="6"/><line x1="10" y1="12" x2="21" y2="12"/><line x1="10" y1="18" x2="21" y2="18"/><text x="3" y="7" font-size="6" fill="currentColor" stroke="none">1</text><text x="3" y="13" font-size="6" fill="currentColor" stroke="none">2</text><text x="3" y="19" font-size="6" fill="currentColor" stroke="none">3</text></svg>
        </button>
        <button title="Unordered List" data-action="insertUnorderedList">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="4" cy="6" r="1.5" fill="currentColor"/><circle cx="4" cy="12" r="1.5" fill="currentColor"/><circle cx="4" cy="18" r="1.5" fill="currentColor"/></svg>
        </button>
      </div>
      <div class="toolbar-divider"></div>
      <div class="toolbar-group">
        <select id="pageSize" title="Sayfa Boyutu">
          <option value="free">Serbest</option>
          <option value="a4">A4</option>
          <option value="a5">A5</option>
          <option value="a3">A3</option>
          <option value="letter">Letter</option>
          <option value="legal">Legal</option>
        </select>
        <button id="btnOrientation" title="Sayfa Yönü" data-action="toggleOrientation">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="3" width="12" height="18" rx="1"/></svg>
        </button>
      </div>
      <div class="toolbar-divider"></div>
      <div class="toolbar-group">
        <button title="Find & Replace (Ctrl+H)" data-action="findReplace">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>
        <button title="Insert Image" data-action="insertImage">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        </button>
        <button title="Insert Date/Time" data-action="insertDateTime">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        </button>
        <button title="Fullscreen" data-action="fullscreen">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
        </button>
      </div>
    </div>

    <!-- Note Title -->
    <div class="note-title-bar">
      <input type="text" id="noteTitle" placeholder="Untitled Note" spellcheck="true">
      <button class="btn-delete" id="btnDelete" title="Delete Note">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
      </button>
    </div>

    <!-- Editor -->
    <div class="editor-wrapper">
      <div id="editor" contenteditable="true" spellcheck="true"></div>
    </div>

    <!-- Status Bar -->
    <div class="status-bar">
      <span id="wordCount">Words: 0</span>
      <span id="charCount">Characters: 0</span>
      <span id="saveStatus">Saved</span>
    </div>
  </main>

  <!-- Note Context Menu -->
  <div class="context-menu" id="noteContextMenu" hidden>
    <button data-ctx="rename">Adını Değiştir</button>
    <button data-ctx="duplicate">Kopyala</button>
    <button data-ctx="delete" class="ctx-danger">Sil</button>
  </div>

  <!-- Editor Context Menu -->
  <div class="context-menu" id="editorContextMenu" hidden>
    <button data-ectx="cut">Kes</button>
    <button data-ectx="copy">Kopyala</button>
    <button data-ectx="paste">Yapıştır</button>
    <button data-ectx="pasteImage">Panodan Resim Yapıştır</button>
    <button data-ectx="uploadImage">Resim Yükle (Diskten)</button>
  </div>

  <!-- Image Edit Panel (always visible) -->
  <aside class="image-panel" id="imagePanel">
    <div class="image-panel-header">
      <h3>Resim Araçları</h3>
    </div>
    <div class="image-panel-empty" id="imagePanelEmpty">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
      <p>Düzenlemek için bir resme tıklayın</p>
    </div>
    <div class="image-panel-body" id="imagePanelBody" hidden>
      <div class="ip-info" id="ipInfo"></div>
      <div class="ip-actions">
        <button id="ipReplace">Resmi Değiştir</button>
        <button id="ipResetAll">Tümünü Sıfırla</button>
      </div>

      <div class="ip-section">
        <label>Parlaklık <span data-val="brightness">1.00</span></label>
        <input type="range" data-filter="brightness" min="0" max="3" step="0.01" value="1">
        <label>Kontrast <span data-val="contrast">1.00</span></label>
        <input type="range" data-filter="contrast" min="0" max="3" step="0.01" value="1">
        <label>Doygunluk <span data-val="saturate">1.00</span></label>
        <input type="range" data-filter="saturate" min="0" max="3" step="0.01" value="1">
        <label>Ton <span data-val="hue-rotate">0°</span></label>
        <input type="range" data-filter="hue-rotate" min="0" max="360" step="1" value="0">
        <label>Bulanıklık <span data-val="blur">0px</span></label>
        <input type="range" data-filter="blur" min="0" max="20" step="0.1" value="0">
        <label>Gri Ton <span data-val="grayscale">0.00</span></label>
        <input type="range" data-filter="grayscale" min="0" max="1" step="0.01" value="0">
        <label>Sepya <span data-val="sepia">0.00</span></label>
        <input type="range" data-filter="sepia" min="0" max="1" step="0.01" value="0">
        <label>İnvert <span data-val="invert">0.00</span></label>
        <input type="range" data-filter="invert" min="0" max="1" step="0.01" value="0">
      </div>

      <div class="ip-section">
        <h4>Kırp</h4>
        <label>Üst <span data-val="cropTop">0%</span></label>
        <input type="range" data-crop="top" min="0" max="90" step="1" value="0">
        <label>Sağ <span data-val="cropRight">0%</span></label>
        <input type="range" data-crop="right" min="0" max="90" step="1" value="0">
        <label>Alt <span data-val="cropBottom">0%</span></label>
        <input type="range" data-crop="bottom" min="0" max="90" step="1" value="0">
        <label>Sol <span data-val="cropLeft">0%</span></label>
        <input type="range" data-crop="left" min="0" max="90" step="1" value="0">
      </div>

      <div class="ip-section">
        <h4>Dönüşüm</h4>
        <label>Döndür <span data-val="rotate">0°</span></label>
        <input type="range" data-xform="rotate" min="-180" max="180" step="1" value="0">
        <div class="ip-buttons">
          <button data-xform-btn="flipH">Yatay Çevir</button>
          <button data-xform-btn="flipV">Dikey Çevir</button>
        </div>
      </div>

      <div class="ip-actions">
        <button id="ipDelete" class="ip-danger">Resmi Sil</button>
      </div>
    </div>
  </aside>

  <!-- Hidden file input for image replace -->
  <input type="file" id="imageReplaceInput" accept="image/*" style="display:none">

  <!-- Find & Replace Dialog -->
  <div class="dialog-overlay" id="findReplaceDialog" style="display:none">
    <div class="dialog">
      <div class="dialog-header">
        <h3>Find & Replace</h3>
        <button class="dialog-close" id="closeFindReplace">&times;</button>
      </div>
      <div class="dialog-body">
        <label>Find:</label>
        <input type="text" id="findInput">
        <label>Replace with:</label>
        <input type="text" id="replaceInput">
      </div>
      <div class="dialog-footer">
        <button id="btnFindNext">Find Next</button>
        <button id="btnReplace">Replace</button>
        <button id="btnReplaceAll">Replace All</button>
      </div>
    </div>
  </div>

  <!-- Hidden file input for Open -->
  <input type="file" id="fileInput" accept=".txt,.md,.html,.docx,.xlsx,.xls,.csv,.pdf,.jpg,.jpeg,.png,.gif,.bmp,.webp" style="display:none">

  <!-- Import progress overlay -->
  <div class="import-overlay" id="importOverlay" hidden>
    <div class="import-box">
      <div class="import-spinner"></div>
      <div class="import-text" id="importText">Yükleniyor...</div>
      <div class="import-progress"><div class="import-bar" id="importBar"></div></div>
    </div>
  </div>
  <!-- Hidden file input for image insert -->
  <input type="file" id="imageInput" accept="image/*" multiple style="display:none">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.2/html2pdf.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html-docx-js@0.3.1/dist/html-docx.js"></script>
  <script>
    // One-time force unregister any old SW + purge all caches, then hard reload
    (async () => {
      const KEY = 'sw_purged_v25';
      if (!('serviceWorker' in navigator)) return;
      if (localStorage.getItem(KEY)) return;
      try {
        const regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(r => r.unregister()));
        if (window.caches) {
          const keys = await caches.keys();
          await Promise.all(keys.map(k => caches.delete(k)));
        }
      } catch {}
      localStorage.setItem(KEY, '1');
      location.reload();
    })();
  </script>
  <script src="app.js?v=26"></script>
  <script>
    // Always unregister any SW on load — no caching layer
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(r => r.unregister())).catch(() => {});
      if (window.caches) caches.keys().then(ks => ks.forEach(k => caches.delete(k))).catch(() => {});
    }
  </script>
</body>
</html>
