<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notepad Web Clipper Ayarları</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      min-width: 360px;
      background: Canvas;
      color: CanvasText;
    }

    main {
      display: grid;
      gap: 14px;
      padding: 20px;
    }

    h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
    }

    label {
      display: grid;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
    }

    input {
      box-sizing: border-box;
      width: 100%;
      border: 1px solid color-mix(in srgb, CanvasText 22%, transparent);
      border-radius: 8px;
      padding: 10px 11px;
      font: inherit;
      background: Canvas;
      color: CanvasText;
    }

    button {
      width: fit-content;
      border: 0;
      border-radius: 8px;
      padding: 9px 14px;
      font: inherit;
      font-weight: 700;
      color: white;
      background: #276ef1;
      cursor: pointer;
    }

    p {
      margin: 0;
      color: color-mix(in srgb, CanvasText 70%, transparent);
      font-size: 13px;
      line-height: 1.45;
    }

    #status {
      min-height: 18px;
      color: #1f8a4c;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main>
    <h1>Notepad Web Clipper</h1>
    <label>
      Notepad adresi
      <input id="notepadUrl" type="url" placeholder="https://not.drtr.uk/">
    </label>
    <button id="save">Kaydet</button>
    <p>Uzantı ikonuna bastığınızda aktif sekmenin başlığı ve adresi bu Notepad uygulamasına yeni not olarak eklenir.</p>
    <p id="status" role="status"></p>
  </main>
  <script src="options.js"></script>
</body>
</html>
