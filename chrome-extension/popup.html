<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notepad'e Ekle</title>
  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color-scheme: dark;
    }

    body {
      width: 320px;
      max-height: 560px;
      margin: 0;
      background: #17172a;
      color: #f8fafc;
    }

    main {
      display: grid;
      grid-template-rows: auto auto auto 1fr;
      min-height: 420px;
    }

    header {
      padding: 14px 14px 10px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    h1 {
      margin: 0;
      font-size: 15px;
      line-height: 1.25;
    }

    #pageTitle {
      margin-top: 5px;
      color: #aab0c7;
      font-size: 12px;
      line-height: 1.35;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #newNote {
      margin: 12px 14px 10px;
      border: 0;
      border-radius: 8px;
      padding: 11px 12px;
      font: inherit;
      font-size: 14px;
      font-weight: 800;
      color: #fff;
      background: #4361ee;
      cursor: pointer;
    }

    #search {
      box-sizing: border-box;
      width: calc(100% - 28px);
      margin: 0 14px 10px;
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 6px;
      padding: 9px 10px;
      background: #303044;
      color: #fff;
      font: inherit;
      font-size: 13px;
      outline: none;
    }

    #search::placeholder {
      color: #9ca3af;
    }

    #status {
      margin: 0 14px 10px;
      min-height: 18px;
      color: #aab0c7;
      font-size: 12px;
      line-height: 1.35;
    }

    #status[data-state="ok"] {
      color: #55d98d;
      font-weight: 700;
    }

    #status[data-state="error"] {
      color: #ff8a8a;
      font-weight: 700;
    }

    #noteList {
      overflow-y: auto;
      max-height: 350px;
      padding-bottom: 8px;
    }

    .note {
      display: grid;
      grid-template-columns: 18px 1fr;
      gap: 9px;
      width: 100%;
      border: 0;
      border-left: 3px solid transparent;
      padding: 10px 14px 10px 11px;
      background: transparent;
      color: inherit;
      text-align: left;
      cursor: pointer;
      font: inherit;
    }

    .note:hover,
    .note:focus {
      background: #22264e;
      border-left-color: #4361ee;
      outline: none;
    }

    .note.active {
      background: #242856;
    }

    .box {
      width: 14px;
      height: 14px;
      margin-top: 2px;
      border-radius: 2px;
      background: #fff;
    }

    .note.active .box {
      background: #4361ee;
      box-shadow: inset 0 0 0 3px #4361ee;
      position: relative;
    }

    .note.active .box::after {
      content: "";
      position: absolute;
      left: 4px;
      top: 1px;
      width: 4px;
      height: 8px;
      border: solid #fff;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }

    .title {
      display: block;
      font-size: 14px;
      font-weight: 800;
      line-height: 1.25;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .preview {
      display: block;
      margin-top: 3px;
      color: #aab0c7;
      font-size: 12px;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .time {
      display: block;
      margin-top: 4px;
      color: #858ba5;
      font-size: 11px;
    }

    .empty {
      padding: 18px 14px;
      color: #aab0c7;
      font-size: 13px;
      text-align: center;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Nota ekle</h1>
      <div id="pageTitle">Aktif sayfa hazırlanıyor...</div>
    </header>
    <button id="newNote">+ New Note</button>
    <input id="search" type="search" placeholder="Search notes...">
    <div id="status" role="status">Notlar yükleniyor...</div>
    <div id="noteList"></div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
