<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notepad'e Kaydet</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      width: 260px;
      margin: 0;
      background: Canvas;
      color: CanvasText;
    }

    main {
      display: grid;
      gap: 10px;
      padding: 14px;
    }

    h1 {
      margin: 0;
      font-size: 15px;
      line-height: 1.25;
    }

    p {
      margin: 0;
      color: color-mix(in srgb, CanvasText 72%, transparent);
      font-size: 13px;
      line-height: 1.4;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 9px 12px;
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      color: white;
      background: #2563eb;
      cursor: pointer;
    }

    #status[data-state="ok"] {
      color: #16834a;
      font-weight: 700;
    }

    #status[data-state="error"] {
      color: #b42318;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <h1>Notepad'e kaydediliyor</h1>
    <p id="status">Aktif sekme, ekran görüntüsü ve varsa PDF not olarak ekleniyor...</p>
    <button id="retry" hidden>Tekrar dene</button>
  </main>
  <script src="popup.js"></script>
</body>
</html>
